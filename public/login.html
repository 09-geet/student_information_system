<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Student Information System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <!-- Logo / Branding -->
    <div class="auth-brand">
      <div class="brand-icon">🎓</div>
      <h1>Student Information System</h1>
      <p>Sign in to manage student records</p>
    </div>

    <!-- Login Card -->
    <div class="card auth-card">
      <div class="auth-header-tabs">
        <a href="/login.html" class="auth-tab active">Admin Login</a>
        <a href="/student-login.html" class="auth-tab">Student Portal</a>
      </div>

      <h2 class="card-title" style="margin-top: 1rem;">Administrator Login</h2>

      <!-- Error / Success Banner -->
      <div id="auth-alert" class="alert hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
          <span class="field-error" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle password visibility" onclick="togglePassword()">
              👁
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span class="btn-text">Sign In as Admin</span>
          <span class="btn-spinner hidden">⏳ Signing in…</span>
        </button>
      </form>

      <div class="auth-footer-links" style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 1rem;">
        <p class="auth-hint" style="margin-top: 0;">
          Default credentials: <strong>admin</strong> / <strong>Admin@123</strong>
        </p>
        <p style="font-size: 0.825rem; color: var(--gray-500); margin-top: 0.5rem;">
          Are you a student? <a href="/student-login.html" style="font-weight: 600;">Student Portal Login &rarr;</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/csrf.js"></script>
<script src="js/login.js"></script>
</body>
</html>
